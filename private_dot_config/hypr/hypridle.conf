general {
    lock_cmd = pidof hyprlock || hyprlock --immediate-render &     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = ~/.config/hypr/scripts/hypridle-resume  # restore display and reattach Kanata after suspend.
}

listener {
    timeout = 150                         # 2.5min.
    on-timeout = brightnessctl -s set 10  # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r          # monitor backlight restore.
}

# turn off keyboard backlight
listener { 
    timeout = 150                                           # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0  # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight         # turn on keyboard backlight.
}

listener {
    timeout = 300                       # 5min
    on-timeout = loginctl lock-session  # lock screen when timeout has passed
}

listener {
    timeout = 330                           # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # screen on when activity is detected.
}

listener {
    timeout = 600                   # 10min
    on-timeout = systemctl suspend  # suspend pc
}
